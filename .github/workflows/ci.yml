name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    name: "static + selftest (py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the oldest version still installable in CI (the uploader
        # itself targets 3.6, which facility workstations run but GitHub
        # runners no longer provide); 3.12 covers current installs.
        # 3.8 is pinned to ubuntu-22.04 because setup-python has no 3.8
        # builds for newer runner images.
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Static checks (syntax, version sync, hardware guards)
        run: python3 testing/static_check.py

      - name: Construct and validate a synthetic v2.0 bundle (current schema, vendor + instrument blocks)
        run: |
          BUNDLE=$(python3 testing/make_synthetic_bundle.py --out-dir "${{ runner.temp }}")
          python3 uploader/upload_bundle.py "$BUNDLE" --selftest

      - name: Packer round-trip (unpack a desktest bundle's expno tree, re-pack, require bit-identical data + valid v2.0 meta)
        run: python3 testing/test_pack_roundtrip.py

      - name: Report QA flags (param_api lines for 0.7.4 / 0.7.5 metas, rows declared vs read from a short ser or a 1D fid)
        # The report generator is the one numpy consumer in the repository
        # (matplotlib for its figures); every other step stays stdlib-only.
        run: |
          python3 -m pip install --quiet numpy matplotlib
          python3 testing/test_report_qa_flags.py --out-dir "${{ runner.temp }}/qaflags"

      - name: Wind-aware halo construction + sidereal-modulation fit (spec Sec. 7 (v) unit checks; Sec. 7 (vi) recovery on one 240-row synthetic, the untimed skip path and the site combiner; --full for null, lab cycle, orientation skip)
        # Quick mode (one 240-row report, a few minutes); the long cases run
        # locally with --full.  Needs the numpy install of the previous step.
        run: python3 testing/test_wind_sidereal.py --out-dir "${{ runner.temp }}/windsidereal"

      - name: Construct and validate a synthetic v1.2 bundle (back-compat; what the TopSpin orchestrator writes)
        run: |
          BUNDLE=$(python3 testing/make_synthetic_bundle.py --schema-version 1.2 --out-dir "${{ runner.temp }}")
          python3 uploader/upload_bundle.py "$BUNDLE" --selftest

      - name: Construct and validate a synthetic v1.1 bundle (back-compat)
        run: |
          BUNDLE=$(python3 testing/make_synthetic_bundle.py --schema-version 1.1 --out-dir "${{ runner.temp }}")
          python3 uploader/upload_bundle.py "$BUNDLE" --selftest

      - name: Construct and validate a synthetic v1.0 bundle (back-compat)
        run: |
          BUNDLE=$(python3 testing/make_synthetic_bundle.py --schema-version 1.0 --out-dir "${{ runner.temp }}")
          python3 uploader/upload_bundle.py "$BUNDLE" --selftest
